buildscript {
  repositories { mavenCentral() }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'com.t3tools.textmarquee'
version = '0.0.0'

android {
  namespace 'expo.modules.t3textmarquee'
  compileSdk rootProject.ext.compileSdkVersion

  defaultConfig {
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
  }
  buildFeatures { compose true }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation project(':expo-ui')
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.compose.foundation:foundation-android:1.12.1'
  implementation 'androidx.compose.ui:ui-android:1.12.1'
}
